version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: UTC
    open-pull-requests-limit: 5
    assignees:
      - quonic
    reviewers:
      - quonic
    labels:
      - dependencies
      - go
    groups:
      go-patch-minor:
        update-types:
          - patch
          - minor
      go-major:
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: UTC
    open-pull-requests-limit: 5
    assignees:
      - quonic
    reviewers:
      - quonic
    labels:
      - dependencies
      - github-actions
    groups:
      actions-patch-minor:
        update-types:
          - patch
          - minor
      actions-major:
        update-types:
          - major
