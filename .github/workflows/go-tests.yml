name: Go Validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

jobs:
  quality:
    name: Quality Checks
    if: >
      github.event_name != 'push' ||
      (
        !contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, 'skip ci') &&
        !contains(github.event.head_commit.message, 'ci skip') &&
        !contains(github.event.head_commit.message, 'no-ci') &&
        !contains(github.event.head_commit.message, 'skip-ci') &&
        !contains(github.event.head_commit.message, 'skip workflows') &&
        !contains(github.event.head_commit.message, 'skip github actions') &&
        !contains(github.event.head_commit.message, 'skip actions')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt
        run: |
          unformatted="$(find . -name '*.go' -not -path './vendor/*' -print0 | xargs -0 -r gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "These Go files need formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

  test:
    name: Tests and Coverage
    if: >
      github.event_name != 'push' ||
      (
        !contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, 'skip ci') &&
        !contains(github.event.head_commit.message, 'ci skip') &&
        !contains(github.event.head_commit.message, 'no-ci') &&
        !contains(github.event.head_commit.message, 'skip-ci') &&
        !contains(github.event.head_commit.message, 'skip workflows') &&
        !contains(github.event.head_commit.message, 'skip github actions') &&
        !contains(github.event.head_commit.message, 'skip actions')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with race detector
        run: go test -race ./...

      - name: Run tests with coverage
        run: go test -covermode=atomic -coverprofile=coverage.out ./...

      - name: Summarize coverage
        run: go tool cover -func=coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage.out
          if-no-files-found: error
          retention-days: 14
