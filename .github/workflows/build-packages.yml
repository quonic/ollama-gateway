name: Build Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  build-packages:
    name: Build deb and rpm (${{ matrix.arch }})
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        !contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, 'skip ci') &&
        !contains(github.event.head_commit.message, 'ci skip') &&
        !contains(github.event.head_commit.message, 'no-ci') &&
        !contains(github.event.head_commit.message, 'skip-ci') &&
        !contains(github.event.head_commit.message, 'skip workflows') &&
        !contains(github.event.head_commit.message, 'skip github actions') &&
        !contains(github.event.head_commit.message, 'skip actions')
      ) ||
      (
        github.event_name == 'pull_request' &&
        !contains(github.event.pull_request.title, '[skip ci]') &&
        !contains(github.event.pull_request.title, '[ci skip]') &&
        !contains(github.event.pull_request.title, 'skip ci') &&
        !contains(github.event.pull_request.title, 'ci skip') &&
        !contains(github.event.pull_request.title, 'no-ci') &&
        !contains(github.event.pull_request.title, 'skip-ci') &&
        !contains(github.event.pull_request.title, 'skip workflows') &&
        !contains(github.event.pull_request.title, 'skip github actions') &&
        !contains(github.event.pull_request.title, 'skip actions') &&
        !contains(github.event.pull_request.body, '[skip ci]') &&
        !contains(github.event.pull_request.body, '[ci skip]') &&
        !contains(github.event.pull_request.body, 'skip ci') &&
        !contains(github.event.pull_request.body, 'ci skip') &&
        !contains(github.event.pull_request.body, 'no-ci') &&
        !contains(github.event.pull_request.body, 'skip-ci') &&
        !contains(github.event.pull_request.body, 'skip workflows') &&
        !contains(github.event.pull_request.body, 'skip github actions') &&
        !contains(github.event.pull_request.body, 'skip actions')
      )
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build packages
        env:
          ARCH: ${{ matrix.arch }}
        run: ./scripts/build-packages.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ollama-gateway-packages-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: bin/packages/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: bin/packages/*
          generate_release_notes: true
          fail_on_unmatched_files: true
