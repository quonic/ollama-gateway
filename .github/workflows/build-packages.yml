name: Build Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-packages:
    name: Build packages (${{ matrix.os }} ${{ matrix.arch }})
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        !contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, 'skip ci') &&
        !contains(github.event.head_commit.message, 'ci skip') &&
        !contains(github.event.head_commit.message, 'no-ci') &&
        !contains(github.event.head_commit.message, 'skip-ci') &&
        !contains(github.event.head_commit.message, 'skip workflows') &&
        !contains(github.event.head_commit.message, 'skip github actions') &&
        !contains(github.event.head_commit.message, 'skip actions')
      )
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: windows
            arch: amd64
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install nfpm
        if: matrix.os == 'linux'
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Linux packages
        if: matrix.os == 'linux'
        env:
          ARCH: ${{ matrix.arch }}
        run: ./scripts/build-packages.sh

      - name: Install WiX Toolset v7
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 7.0.0
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows MSI
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
        run: ./packaging/scripts/build-packages.ps1

      - name: Upload workflow artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ollama-gateway-packages-${{ matrix.os }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: bin/packages/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: bin/packages/*
          generate_release_notes: true
          fail_on_unmatched_files: true
